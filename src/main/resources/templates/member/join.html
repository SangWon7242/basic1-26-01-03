<meta charset="UTF-8">

<h1>회원가입</h1>

<form action="join" method="POST">
  <div>
    <input type="text" name="username" placeholder="아이디입력">
  </div>
  <div>
    <input type="password" name="password" placeholder="비밀번호입력">
  </div>
  <div>
    <input type="text" name="name" placeholder="이름">
  </div>
  <button type="submit">회원가입</button>
</form>
