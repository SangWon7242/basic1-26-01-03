<meta charset="UTF-8">

<script>
    function loginSubmit__done(form) {
        form.username.value = form.username.value.trim();

        if (form.username.value.length === 0) {
            alert("아이디를 입력해주세요.");
            form.username.focus();
            return;
        }

        form.password.value = form.password.value.trim();

        if (form.password.value.length === 0) {
            alert("비밀번호 입력해주세요.");
            form.password.focus();
            return;
        }

        form.submit();
    }
</script>

<h1>로그인</h1>

<form onsubmit="loginSubmit__done(this); return false;" action="login" method="POST">
  <div>
    <input type="text" name="username" placeholder="아이디입력">
  </div>
  <div>
    <input type="password" name="password" placeholder="비밀번호입력">
  </div>
  <button type="submit">로그인</button>
</form>
